<title>MR. PERFECT YADAV</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow-x:hidden;
 font-family:Arial,sans-serif;
 color:white;
 background:linear-gradient(135deg,#050014,#101044,#16002c,#020817);
 background-size:400% 400%;
 animation:bg 12s ease infinite;
 padding:25px 12px;
}

@keyframes bg{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

.grid{
 position:fixed;
 inset:0;
 background-image:
 linear-gradient(rgba(0,255,255,.12) 1px,transparent 1px),
 linear-gradient(90deg,rgba(0,255,255,.12) 1px,transparent 1px);
 background-size:45px 45px;
 transform:perspective(400px) rotateX(60deg) scale(2.2);
 transform-origin:bottom;
 animation:move 8s linear infinite;
 pointer-events:none;
}
@keyframes move{
 from{background-position:0 0}
 to{background-position:0 90px}
}

.orb{
 position:fixed;
 width:130px;height:130px;
 border-radius:50%;
 background:radial-gradient(circle at 30% 25%,#fff,#00d9ff 15%,#3500a8 55%,transparent 75%);
 filter:drop-shadow(0 0 25px #00d9ff);
 opacity:.6;
 animation:float 7s ease-in-out infinite;
}
.orb.one{top:8%;left:5%}
.orb.two{bottom:8%;right:5%;animation-delay:2s}
@keyframes float{
 0%,100%{transform:translateY(0) rotate(0)}
 50%{transform:translateY(-35px) rotate(25deg)}
}

.card{
 position:relative;
 z-index:2;
 width:100%;
 max-width:410px;
 text-align:center;
 padding:32px 22px;
 border:1px solid rgba(0,238,255,.6);
 border-radius:25px;
 background:rgba(5,8,30,.76);
 backdrop-filter:blur(15px);
 box-shadow:0 0 25px #00cfff, inset 0 0 25px rgba(0,200,255,.12);
}

.profile{
 width:145px;height:145px;
 object-fit:cover;
 border-radius:50%;
 border:4px solid #00eaff;
 box-shadow:0 0 25px #00d9ff,0 0 45px #8b00ff;
 margin-bottom:20px;
}

.welcome{
 color:#ffd700;
 font-size:15px;
 line-height:1.8;
 margin:0 auto 17px;
 text-shadow:0 0 12px #ff9900;
 overflow-wrap:anywhere;
}

h1{
 font-size:27px;
 font-weight:900;
 margin-bottom:12px;
 color:#fff;
 text-shadow:0 0 10px #00eaff,0 0 25px #8b00ff;
}

.subtitle{
 color:#b9eaff;
 margin-bottom:24px;
 letter-spacing:2px;
 font-size:13px;
}

.links{
 display:flex;
 flex-direction:column;
 gap:13px;
}

.links a{
 text-decoration:none;
 color:white;
 font-weight:bold;
 padding:14px;
 border-radius:30px;
 border:1px solid #00eaff;
 background:linear-gradient(90deg,#101044,#182b65);
 box-shadow:0 0 12px rgba(0,220,255,.35);
 transition:.3s;
}

.links a:hover{
 transform:scale(1.04);
 background:linear-gradient(90deg,#7800ff,#007bff);
 box-shadow:0 0 22px #00eaff;
}

footer{
 margin-top:25px;
 color:#a9c9ff;
 font-size:12px;
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main class="card">

<img class="profile" src="profile.jpg" alt="MR PERFECT YADAV">
